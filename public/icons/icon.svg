<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Ambient Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#brandGrad)" stroke-width="4" opacity="0.4" filter="url(#glow)" />

  <!-- Server Stack Node 1 (Top) -->
  <g transform="translate(106, 130)">
    <rect width="300" height="64" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <!-- Server LED Indicators -->
    <circle cx="36" cy="32" r="8" fill="#10B981" />
    <circle cx="64" cy="32" r="6" fill="#06B6D4" opacity="0.8" />
    <circle cx="88" cy="32" r="6" fill="#6366F1" opacity="0.6" />
    <!-- Server Drive Slots -->
    <line x1="130" y1="32" x2="270" y2="32" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Server Stack Node 2 (Middle) -->
  <g transform="translate(106, 218)">
    <rect width="300" height="64" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <!-- Server LED Indicators -->
    <circle cx="36" cy="32" r="8" fill="#10B981" />
    <circle cx="64" cy="32" r="6" fill="#06B6D4" opacity="0.8" />
    <circle cx="88" cy="32" r="6" fill="#6366F1" opacity="0.6" />
    <!-- Server Drive Slots -->
    <line x1="130" y1="32" x2="270" y2="32" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Server Stack Node 3 (Bottom) -->
  <g transform="translate(106, 306)">
    <rect width="300" height="64" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <!-- Server LED Indicators -->
    <circle cx="36" cy="32" r="8" fill="#10B981" />
    <circle cx="64" cy="32" r="6" fill="#06B6D4" opacity="0.8" />
    <circle cx="88" cy="32" r="6" fill="#6366F1" opacity="0.6" />
    <!-- Server Drive Slots -->
    <line x1="130" y1="32" x2="270" y2="32" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Central Shield Badge of Ops Power -->
  <g transform="translate(206, 206)">
    <path d="M50 0 L92 18 L92 56 C92 84 50 106 50 106 C50 106 8 84 8 56 L8 18 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    <!-- Pulse Line Inside Shield -->
    <path d="M30 54 L44 54 L48 40 L52 68 L56 50 L62 58 L70 54" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Brand Text Monogram -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" letter-spacing="4">NMH OPS</text>
</svg>
