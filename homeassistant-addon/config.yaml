name: NMH Ops Controller Home Assistant Connector
version: "2.1.5"
slug: nmh_ops_controller_connector
description: Publishes Home Assistant system and selected sensor telemetry to NMH Ops Controller Fleet.
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
options:
  central_server_url: "http://192.168.1.10:3003"
  home_assistant_url: "http://supervisor/core"
  home_assistant_token: ""
  telemetry_interval_seconds: 5
  cpu_entity_id: ""
  memory_entity_id: ""
  memory_used_entity_id: "sensor.memory_use"
  memory_free_entity_id: "sensor.memory_free"
  disk_used_percent_entity_id: "sensor.system_monitor_disk_use_percent"
  disk_free_entity_id: "sensor.system_monitor_disk_free"
  power_entity_ids: []
  temperature_entity_ids: []
schema:
  central_server_url: url
  home_assistant_url: url
  home_assistant_token: password?
  telemetry_interval_seconds: int(2,60)
  cpu_entity_id: str?
  memory_entity_id: str?
  memory_used_entity_id: str?
  memory_free_entity_id: str?
  disk_used_percent_entity_id: str?
  disk_free_entity_id: str?
  power_entity_ids:
    - str
  temperature_entity_ids:
    - str
