services:
  minhhungops-controller:
    build:
      context: .
      dockerfile: Dockerfile
    image: minhhungops-controller:latest
    container_name: minhhungops-controller
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - HOST=0.0.0.0
      - PORT=3003
      - DATA_DIR=/app/data
      - TZ=Asia/Bangkok
    volumes:
      - minhhungops_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  minhhungops_data:
    name: minhhungops_controller_data
