services:
  minhhungops-controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minhhungops-controller
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - HOST=0.0.0.0
      - PORT=3003
      - DATA_DIR=/app/data
      - TZ=Asia/Bangkok
    volumes:
      - ./data:/app/data
